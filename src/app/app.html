<main class="w-full h-full min-h-screen p-4 pt-0 bg-background-primary text-text-primary">
  <div class="sticky top-0 py-4 bg-background-primary flex justify-between items-center">
    <h2 class="font-medium">Transfer Area</h2>
    <app-button (click)="removeAllItems()">Clean History</app-button>
  </div>
  <div class="flex flex-col gap-1.5">
    @for (text of clipboardTextArray(); track text) {
      <app-copied-card [text]="text" (onRemove)="removeItem($event)" />
    } @empty {
      <p>No copied text available.</p>
    }
  </div>
</main>
